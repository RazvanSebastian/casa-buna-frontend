<app-request-table-filters (filtersChange)="onFiltersChange($event)" />

@if (requestPage(); as requestPage) {
  @if (displayedColumns(); as displayedColumns) {
    <table mat-table [dataSource]="requestPage.content">
      <ng-container matColumnDef="firstName">
        <th mat-header-cell *matHeaderCellDef>Prenume</th>
        <td mat-cell *matCellDef="let element">{{ element.firstName }}</td>
      </ng-container>
      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef>Nume</th>
        <td mat-cell *matCellDef="let element">{{ element.lastName }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let element">{{ element.requestor.email }}</td>
      </ng-container>
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Telefon</th>
        <td mat-cell *matCellDef="let element">{{ element.phone }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Telefon</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>
      <ng-container matColumnDef="detailsAction">
        <th mat-header-cell *matHeaderCellDef>Detalii</th>
        <td mat-cell *matCellDef="let element">
          <button matIconButton (click)="onOpenDialogRequestInfo(element)">
            <mat-icon>info</mat-icon>
          </button>
        </td>
      </ng-container>
      <ng-container matColumnDef="approveAction">
        <th mat-header-cell *matHeaderCellDef>Aprobare</th>
        <td mat-cell *matCellDef="let element">
          <button matIconButton (click)="onApproveRequest(element)">
            <mat-icon>check</mat-icon>
          </button>
        </td>
      </ng-container>
      <ng-container matColumnDef="declineAction">
        <th mat-header-cell *matHeaderCellDef>Refuzare</th>
        <td mat-cell *matCellDef="let element">
          <button matIconButton (click)="onDeclineRequest(element)">
            <mat-icon>cancel</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator
      [length]="requestPage.page.totalElements"
      [pageIndex]="requestPage.page.number"
      [pageSize]="requestPage.page.size"
      aria-label="Selecteaza pagina"
      (page)="onPageChange($event)"
    >
    </mat-paginator>
  }
}
