<h2 mat-dialog-title>{{ notification.title }}</h2>
<mat-dialog-content>
  <p>{{ notification.message }}</p>
  <time>{{ notification.createdAt | date: 'medium' }}</time>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Inchide</button>
</mat-dialog-actions>
