<nav class="row p-2 m-0">
  <div class="col-6 d-flex align-items-center gap-2">
    @if (isOnboarded()) {
      <button mat-icon-button (click)="toggleDrawer()">
        <mat-icon>{{ drawerOpen() ? 'menu_open' : 'menu' }}</mat-icon>
      </button>
    }
    <h3>Casa buna</h3>
  </div>
  <div class="col-6 d-flex flex-row-reverse">
    <button mat-icon-button (click)="onLogout()">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</nav>
<mat-drawer-container>
  @if (isOnboarded()) {
    <mat-drawer #drawer class="h-100 p-3" mode="side" [opened]="drawerOpen()">
      <app-nav-list />
    </mat-drawer>
  }
  <mat-drawer-content>
    <div class="h-100 p-4">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
